<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luar Talian – e-Aduan v3</title>
    <style>
    :root {
        --uitm-purple: #5B2D8E;
        --uitm-purple-dark: #3D1A6E;
        --uitm-gold: #D4A843;
        --uitm-gold-light: #F5E6C0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #F5F3F7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
    }
    .offline-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        padding: 48px 36px;
        max-width: 420px;
        width: 100%;
    }
    .offline-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--uitm-purple), var(--uitm-purple-dark));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
    }
    .offline-icon svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    h1 {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--uitm-purple-dark);
        margin-bottom: 8px;
    }
    p {
        color: #6c757d;
        font-size: 0.92rem;
        line-height: 1.6;
        margin-bottom: 24px;
    }
    .btn-retry {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, var(--uitm-purple), var(--uitm-purple-dark));
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-retry:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(91,45,142,0.3);
    }
    .gold-strip {
        height: 3px;
        width: 60px;
        background: linear-gradient(90deg, var(--uitm-gold), var(--uitm-gold-light));
        border-radius: 3px;
        margin: 0 auto 20px;
    }
    .footer-text {
        margin-top: 32px;
        font-size: 0.72rem;
        color: #bbb;
    }
    </style>
</head>
<body>

<div class="offline-card">
    <div class="offline-icon">
        <svg viewBox="0 0 24 24">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
    </div>

    <div class="gold-strip"></div>

    <h1>Tiada Sambungan Internet</h1>
    <p>
        Anda sedang di luar talian. Sila semak sambungan internet anda
        dan cuba semula untuk mengakses e-Aduan.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Cuba Semula
    </button>

    <div class="footer-text">
        e-Aduan v3 &bull; Bahagian Pengurusan Fasiliti, UiTM
    </div>
</div>

</body>
</html>
